services:
  # Service de votre application Node.js
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://user:password@db:5432/mydatabase"

  # Service pour la base de données PostgreSQL
  db:
    image: postgres:15 # CHANGEMENT ICI: On utilise l'image standard
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NOUVEAU: Service pour l'interface de gestion Adminer
  adminer:
    image: adminer # Image officielle d'Adminer
    restart: always
    ports:
      # On expose l'interface d'Adminer sur le port 8080 de notre machine
      - "8080:8080"
    depends_on:
      # Adminer ne démarrera que si la base de données est prête
      - db

volumes:
  postgres_data: # Correction de la petite erreur de syntaxe ici